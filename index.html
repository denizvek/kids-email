<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הודעות למשפחה ✉️</title>
  <style>
    :root {
      --primary: #4a90e2;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --text: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--primary);
    }

    .settings-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
    }

    .recipients-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .recipient-card {
      background: #eef5fc;
      border: 3px solid transparent;
      border-radius: 15px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .recipient-card.selected {
      border-color: var(--primary);
      background: #d0e4ff;
    }

    .avatar-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 10px;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .change-photo-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      border: 2px solid white;
    }

    .recipient-name {
      font-weight: bold;
      font-size: 1.1rem;
    }

    textarea {
      width: 100%;
      height: 120px;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      font-size: 1.1rem;
      box-sizing: border-box;
      resize: none;
      margin-bottom: 10px;
      font-family: inherit;
    }

    .tools-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: #f0f0f0;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .emoji-picker {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      background: #fff;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 10px;
      max-height: 150px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .emoji-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .send-btn {
      width: 100%;
      background: #4caf50;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(76,175,80,0.3);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 15px;
      width: 90%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .input-group {
      margin-bottom: 10px;
    }

    .input-group label {
      display: block;
      margin-bottom: 3px;
      font-weight: bold;
    }

    .input-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .attachment-preview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #e9e9e9;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .hidden { display: none !important; }
  </style>
</head>
